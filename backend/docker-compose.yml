# Full local stack: MySQL (product catalog) + FastAPI backend + React
# frontend (served by nginx, which proxies /api to the backend container).
#
# Usage:
#   cp .env.example .env      # fill in GOOGLE_API_KEY at minimum
#   docker compose up --build
#
# Frontend: http://localhost:5173
# Backend API docs: http://localhost:8000/docs
#
# First run: MySQL needs the retail_shop schema + sample rows loaded once --
# see the "Docker" section of README.md for how to seed it via the
# db-init.sql mount below.

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-changeme}
      MYSQL_DATABASE: ${DB_NAME:-retail_shop}
      MYSQL_USER: ${DB_USERNAME:-salesman}
      MYSQL_PASSWORD: ${DB_PASSWORD:-changeme}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # Drop your renamed copy of "Sample_data- practice.txt" in as
      # ./db-init.sql (must end in .sql) and MySQL will load it
      # automatically the first time this volume is created.
      - ./db-init.sql:/docker-entrypoint-initdb.d/db-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-changeme}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      DB_USERNAME: ${DB_USERNAME:-salesman}
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-retail_shop}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173}
      API_KEY: ${API_KEY:-}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-20}
      REQUEST_TIMEOUT_SECONDS: ${REQUEST_TIMEOUT_SECONDS:-90}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      EVALUATION_MIN_SCORE: ${EVALUATION_MIN_SCORE:-0.6}
      ENABLE_EVALUATOR_RETRY: ${ENABLE_EVALUATOR_RETRY:-true}
      # Kept outside WORKFLOW/ on purpose: a volume mounted at
      # /app/WORKFLOW/chroma_db is fine (it's a subdirectory the image
      # doesn't otherwise populate), but mounting one over the whole
      # /app/WORKFLOW/ would shadow ORCHE.py and friends that were baked
      # into the image at build time.
      CHECKPOINT_DB_PATH: data/checkpoints.sqlite
      TRACE_DB_PATH: data/traces.sqlite
    ports:
      - "8000:8000"
    volumes:
      # Persist the Chroma RAG store and the conversation checkpoint DB
      # across container restarts/rebuilds.
      - workflow-state:/app/WORKFLOW/chroma_db
      - checkpoint-state:/app/data

  frontend:
    build:
      context: ./FRONTEND
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  mysql-data:
  workflow-state:
  checkpoint-state:
