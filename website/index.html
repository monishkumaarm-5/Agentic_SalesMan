<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trein — Every home, every device</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #ffffff;
  --bg-card: #f8f9fa;
  --bg-hero: #0a1628;
  --text: #1a1a2e;
  --text-muted: #6b7280;
  --accent: #2563eb;
  --accent-hover: #1d4ed8;
  --green: #16a34a;
  --red: #dc2626;
  --orange: #ea580c;
  --gold: #f59e0b;
  --border: #e5e7eb;
  --shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.06);
  --shadow-lg: 0 10px 25px rgba(0,0,0,.1);
  --radius: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f172a;
    --bg-card: #1e293b;
    --bg-hero: #020617;
    --text: #e2e8f0;
    --text-muted: #94a3b8;
    --accent: #3b82f6;
    --accent-hover: #60a5fa;
    --border: #334155;
    --shadow: 0 1px 3px rgba(0,0,0,.3);
    --shadow-lg: 0 10px 25px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"] {
  --bg: #0f172a;
  --bg-card: #1e293b;
  --bg-hero: #020617;
  --text: #e2e8f0;
  --text-muted: #94a3b8;
  --accent: #3b82f6;
  --accent-hover: #60a5fa;
  --border: #334155;
  --shadow: 0 1px 3px rgba(0,0,0,.3);
  --shadow-lg: 0 10px 25px rgba(0,0,0,.4);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  min-height: 100vh;
}
a { color: var(--accent); text-decoration: none; }
a:hover { color: var(--accent-hover); text-decoration: underline; }

/* -- NAV -- */
.nav {
  background: var(--bg-hero);
  color: #fff;
  padding: 0 16px;
  height: 56px;
  display: flex;
  align-items: center;
  gap: 16px;
  position: sticky;
  top: 0;
  z-index: 100;
}
.nav-logo { font-size: 1.3rem; font-weight: 700; letter-spacing: -0.5px; color: #fff; }
.nav-logo span { color: var(--accent); }
.nav-search {
  flex: 1;
  max-width: 480px;
  height: 36px;
  border-radius: 8px;
  border: 1px solid rgba(255,255,255,.15);
  background: rgba(255,255,255,.08);
  color: #fff;
  padding: 0 12px;
  font-size: .9rem;
  outline: none;
}
.nav-search::placeholder { color: rgba(255,255,255,.5); }
.nav-links { display: flex; gap: 12px; margin-left: auto; }
.nav-links a { color: rgba(255,255,255,.8); font-size: .85rem; font-weight: 500; }
.nav-links a:hover { color: #fff; text-decoration: none; }

/* -- CONTAINER -- */
.container { max-width: 1200px; margin: 0 auto; padding: 24px 16px; }

/* -- HERO -- */
.hero {
  background: linear-gradient(135deg, var(--bg-hero) 0%, #1e3a5f 100%);
  color: #fff;
  padding: 48px 16px;
  text-align: center;
}
.hero h1 { font-size: 2rem; font-weight: 700; margin-bottom: 8px; }
.hero p { color: rgba(255,255,255,.7); font-size: 1.05rem; }

/* -- BREADCRUMB -- */
.breadcrumb {
  display: flex;
  gap: 8px;
  align-items: center;
  font-size: .85rem;
  color: var(--text-muted);
  margin-bottom: 24px;
  flex-wrap: wrap;
}
.breadcrumb a { color: var(--text-muted); }
.breadcrumb a:hover { color: var(--accent); }
.breadcrumb .sep { color: var(--border); }

/* -- CATEGORY GRID -- */
.cat-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 16px;
  margin: 32px 0;
}
.cat-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 24px 16px;
  text-align: center;
  cursor: pointer;
  transition: transform .15s, box-shadow .15s;
}
.cat-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
.cat-icon { font-size: 2rem; margin-bottom: 8px; }
.cat-name { font-weight: 600; font-size: .95rem; }
.cat-count { font-size: .8rem; color: var(--text-muted); margin-top: 4px; }

/* -- PRODUCT GRID -- */
.product-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 20px;
  margin: 24px 0;
}
.product-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  cursor: pointer;
  transition: transform .15s, box-shadow .15s;
  display: flex;
  flex-direction: column;
}
.product-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
.product-img {
  width: 100%;
  height: 180px;
  background: linear-gradient(135deg, #e0e7ff 0%, #c7d2fe 100%);
  border-radius: 8px;
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 3rem;
  color: var(--accent);
}
.product-brand { font-size: .75rem; font-weight: 600; color: var(--accent); text-transform: uppercase; letter-spacing: .5px; }
.product-name { font-size: 1rem; font-weight: 600; margin: 4px 0; }
.product-desc { font-size: .82rem; color: var(--text-muted); margin-bottom: 12px; flex: 1;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.product-bottom { display: flex; justify-content: space-between; align-items: flex-end; }
.product-price { font-size: 1.15rem; font-weight: 700; color: var(--green); }
.product-mrp { font-size: .8rem; color: var(--text-muted); text-decoration: line-through; margin-left: 6px; }
.product-rating { display: flex; align-items: center; gap: 4px; font-size: .85rem; font-weight: 600; color: var(--gold); }

/* -- PRODUCT DETAIL -- */
.detail { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; margin: 24px 0; }
@media (max-width: 768px) { .detail { grid-template-columns: 1fr; } }
.detail-img {
  width: 100%;
  aspect-ratio: 1;
  max-height: 400px;
  background: linear-gradient(135deg, #e0e7ff 0%, #c7d2fe 100%);
  border-radius: var(--radius);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 5rem;
  color: var(--accent);
}
.detail-info h1 { font-size: 1.6rem; font-weight: 700; margin-bottom: 4px; }
.detail-brand { font-size: .85rem; color: var(--accent); font-weight: 600; text-transform: uppercase; margin-bottom: 12px; }
.detail-desc { color: var(--text-muted); margin-bottom: 20px; font-size: .95rem; }
.detail-prices { display: flex; align-items: baseline; gap: 12px; margin-bottom: 16px; }
.detail-price { font-size: 1.8rem; font-weight: 700; color: var(--green); }
.detail-mrp { font-size: 1.1rem; color: var(--text-muted); text-decoration: line-through; }
.detail-discount {
  font-size: .85rem;
  font-weight: 600;
  color: #fff;
  background: var(--green);
  padding: 2px 8px;
  border-radius: 4px;
}
.detail-rating {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 20px;
  font-size: .95rem;
}
.stars { color: var(--gold); font-weight: 600; }
.stock-badge {
  display: inline-block;
  padding: 4px 12px;
  border-radius: 6px;
  font-size: .82rem;
  font-weight: 600;
  margin-bottom: 20px;
}
.stock-badge.in-stock { background: #dcfce7; color: #166534; }
.stock-badge.low-stock { background: #fff7ed; color: #9a3412; }
.stock-badge.out-of-stock { background: #fee2e2; color: #991b1b; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .stock-badge.in-stock { background: #14532d; color: #86efac; }
  :root:not([data-theme="light"]) .stock-badge.low-stock { background: #7c2d12; color: #fdba74; }
  :root:not([data-theme="light"]) .stock-badge.out-of-stock { background: #7f1d1d; color: #fca5a5; }
}
.detail-avail { font-size: .85rem; color: var(--text-muted); margin-bottom: 20px; }
.detail-avail strong { color: var(--text); }

.spec-table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 24px;
}
.spec-table caption {
  text-align: left;
  font-size: 1.1rem;
  font-weight: 700;
  margin-bottom: 12px;
}
.spec-table tr { border-bottom: 1px solid var(--border); }
.spec-table td {
  padding: 10px 12px;
  font-size: .9rem;
}
.spec-table td:first-child {
  color: var(--text-muted);
  font-weight: 500;
  width: 40%;
  text-transform: capitalize;
}
.btn-cart {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 12px 32px;
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: 8px;
  font-size: 1rem;
  font-weight: 600;
  cursor: pointer;
  transition: background .15s;
  margin-top: 16px;
}
.btn-cart:hover { background: var(--accent-hover); }
.btn-chat {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 12px 32px;
  background: transparent;
  color: var(--accent);
  border: 2px solid var(--accent);
  border-radius: 8px;
  font-size: 1rem;
  font-weight: 600;
  cursor: pointer;
  margin-top: 16px;
  margin-left: 12px;
}
.btn-chat:hover { background: var(--accent); color: #fff; }

/* -- SECTION -- */
.section-title { font-size: 1.2rem; font-weight: 700; margin-bottom: 16px; }

/* -- 404 -- */
.not-found { text-align: center; padding: 80px 16px; }
.not-found h1 { font-size: 4rem; font-weight: 700; color: var(--accent); }
.not-found p { color: var(--text-muted); margin-top: 12px; font-size: 1.1rem; }

/* -- FOOTER -- */
.footer {
  background: var(--bg-hero);
  color: rgba(255,255,255,.6);
  text-align: center;
  padding: 32px 16px;
  margin-top: 48px;
  font-size: .85rem;
}
.footer a { color: rgba(255,255,255,.8); }
.footer .footer-links { display: flex; justify-content: center; gap: 24px; margin-bottom: 12px; flex-wrap: wrap; }

/* -- LOADING -- */
.loading { text-align: center; padding: 80px 16px; color: var(--text-muted); }
.spinner { display: inline-block; width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<nav class="nav">
  <a href="#/" class="nav-logo"><span>T</span>rein</a>
  <input class="nav-search" id="searchBox" type="text" placeholder="Search products...">
  <div class="nav-links">
    <a href="#/">Home</a>
    <a href="#/categories">Categories</a>
    <a href="http://localhost:5173" target="_blank">Chat with AI</a>
  </div>
</nav>

<div id="app">
  <div class="loading"><div class="spinner"></div><p style="margin-top:16px">Loading catalog...</p></div>
</div>

<footer class="footer">
  <div class="footer-links">
    <a href="#/">Home</a>
    <a href="#/categories">All Categories</a>
    <a href="http://localhost:5173" target="_blank">AI Shopping Assistant</a>
    <a href="http://localhost:8000/docs" target="_blank">API Docs</a>
  </div>
  <p>&copy; 2025 Trein — Every home, every device, one store. &bull; 1800-000-0000</p>
</footer>

<script>
const CATEGORY_ICONS = {
  'Mobile': '📱', 'Laptop': '💻', 'Tablet': '📟', 'Television': '📺',
  'Headphone': '🎧', 'Speaker': '🔊', 'Smartwatch': '⌚',
  'Refrigerator': '🧊', 'Washing Machine': '🫧', 'Air Conditioner': '❄️',
  'Microwave Oven': '🍳', 'Mixer Grinder': '🥣',
};

let products = [];
let bySlug = {};
let byCategory = {};

function fmt(n) {
  return '₹' + n.toLocaleString('en-IN');
}

function discount(price, mrp) {
  if (!mrp || mrp <= price) return 0;
  return Math.round(((mrp - price) / mrp) * 100);
}

function starStr(rating) {
  const full = Math.floor(rating);
  const half = rating - full >= 0.3;
  return '★'.repeat(full) + (half ? '½' : '') + '☆'.repeat(5 - full - (half ? 1 : 0));
}

function stockInfo(units) {
  if (units <= 0) return { text: 'Out of stock', cls: 'out-of-stock' };
  if (units <= 5) return { text: `Only ${units} left!`, cls: 'low-stock' };
  return { text: 'In stock', cls: 'in-stock' };
}

function productIcon(category) {
  return CATEGORY_ICONS[category] || '📦';
}

// ---- RENDERERS ----

function renderHome() {
  const cats = Object.keys(byCategory).sort();
  const featured = products.filter(p => p.rating >= 4.4).slice(0, 8);
  return `
    <div class="hero">
      <h1>Welcome to Trein</h1>
      <p>Every home, every device — one store. Browse ${products.length} products across ${cats.length} categories.</p>
    </div>
    <div class="container">
      <h2 class="section-title">Shop by Category</h2>
      <div class="cat-grid">
        ${cats.map(c => `
          <div class="cat-card" onclick="navigate('/c/${encodeURIComponent(c)}')">
            <div class="cat-icon">${CATEGORY_ICONS[c] || '📦'}</div>
            <div class="cat-name">${c}</div>
            <div class="cat-count">${byCategory[c].length} products</div>
          </div>
        `).join('')}
      </div>
      ${featured.length ? `
        <h2 class="section-title" style="margin-top:40px">Top Rated</h2>
        <div class="product-grid">
          ${featured.map(renderProductCard).join('')}
        </div>
      ` : ''}
    </div>`;
}

function renderCategories() {
  const cats = Object.keys(byCategory).sort();
  return `
    <div class="container">
      <div class="breadcrumb"><a href="#/">Home</a> <span class="sep">/</span> Categories</div>
      <h2 class="section-title">All Categories</h2>
      <div class="cat-grid">
        ${cats.map(c => `
          <div class="cat-card" onclick="navigate('/c/${encodeURIComponent(c)}')">
            <div class="cat-icon">${CATEGORY_ICONS[c] || '📦'}</div>
            <div class="cat-name">${c}</div>
            <div class="cat-count">${byCategory[c].length} products</div>
          </div>
        `).join('')}
      </div>
    </div>`;
}

function renderCategoryPage(category) {
  const items = byCategory[category];
  if (!items) return render404(`Category "${category}" not found`);
  return `
    <div class="container">
      <div class="breadcrumb">
        <a href="#/">Home</a> <span class="sep">/</span>
        <a href="#/categories">Categories</a> <span class="sep">/</span> ${category}
      </div>
      <h2 class="section-title">${CATEGORY_ICONS[category] || ''} ${category} <span style="color:var(--text-muted);font-weight:400;font-size:.9rem">(${items.length})</span></h2>
      <div class="product-grid">
        ${items.map(renderProductCard).join('')}
      </div>
    </div>`;
}

function renderProductCard(p) {
  const stock = stockInfo(p.units_available);
  const disc = discount(p.price, p.mrp);
  return `
    <div class="product-card" onclick="navigate('/p/${p.slug}')">
      <div class="product-img">${productIcon(p.category)}</div>
      <div class="product-brand">${p.brand}</div>
      <div class="product-name">${p.name}</div>
      <div class="product-desc">${p.description}</div>
      <div class="product-bottom">
        <div>
          <span class="product-price">${fmt(p.price)}</span>
          ${disc > 0 ? `<span class="product-mrp">${fmt(p.mrp)}</span>` : ''}
        </div>
        <div class="product-rating">${starStr(p.rating)} ${p.rating}</div>
      </div>
    </div>`;
}

function renderProductDetail(slug) {
  const p = bySlug[slug];
  if (!p) return render404(`Product "${slug}" not found`);
  const stock = stockInfo(p.units_available);
  const disc = discount(p.price, p.mrp);
  const attrs = p.attributes || {};
  const attrKeys = Object.keys(attrs);

  return `
    <div class="container">
      <div class="breadcrumb">
        <a href="#/">Home</a> <span class="sep">/</span>
        <a href="#/c/${encodeURIComponent(p.category)}">${p.category}</a> <span class="sep">/</span> ${p.name}
      </div>
      <div class="detail">
        <div class="detail-img">${productIcon(p.category)}</div>
        <div class="detail-info">
          <div class="detail-brand">${p.brand}</div>
          <h1>${p.name}</h1>
          <div class="detail-rating">
            <span class="stars">${starStr(p.rating)}</span>
            <span>${p.rating} / 5</span>
          </div>
          <div class="detail-prices">
            <span class="detail-price">${fmt(p.price)}</span>
            ${p.mrp > p.price ? `<span class="detail-mrp">${fmt(p.mrp)}</span>` : ''}
            ${disc > 0 ? `<span class="detail-discount">${disc}% off</span>` : ''}
          </div>
          <span class="stock-badge ${stock.cls}">${stock.text}</span>
          <div class="detail-desc">${p.description}</div>
          <div class="detail-avail"><strong>Available:</strong> ${p.offline_availability}</div>
          <button class="btn-cart" onclick="alert('Added to cart! (demo)')">🛒 Add to Cart</button>
          <a class="btn-chat" href="http://localhost:5173" target="_blank">💬 Ask AI about this</a>
        </div>
      </div>
      ${attrKeys.length ? `
        <table class="spec-table">
          <caption>Specifications</caption>
          ${attrKeys.map(k => `
            <tr><td>${k.replace(/_/g, ' ')}</td><td>${attrs[k]}</td></tr>
          `).join('')}
        </table>
      ` : ''}
      ${renderRelated(p)}
    </div>`;
}

function renderRelated(p) {
  const related = (byCategory[p.category] || []).filter(x => x.slug !== p.slug).slice(0, 4);
  if (!related.length) return '';
  return `
    <h2 class="section-title" style="margin-top:40px">More in ${p.category}</h2>
    <div class="product-grid">${related.map(renderProductCard).join('')}</div>`;
}

function renderSearch(query) {
  const q = query.toLowerCase();
  const results = products.filter(p =>
    p.name.toLowerCase().includes(q) ||
    p.brand.toLowerCase().includes(q) ||
    p.category.toLowerCase().includes(q) ||
    p.description.toLowerCase().includes(q) ||
    Object.values(p.attributes || {}).some(v => String(v).toLowerCase().includes(q))
  );
  return `
    <div class="container">
      <div class="breadcrumb"><a href="#/">Home</a> <span class="sep">/</span> Search: "${query}"</div>
      <h2 class="section-title">
        ${results.length ? `${results.length} result${results.length > 1 ? 's' : ''} for "${query}"` : `No results for "${query}"`}
      </h2>
      ${results.length ? `<div class="product-grid">${results.map(renderProductCard).join('')}</div>` :
        `<p style="color:var(--text-muted)">Try a different search term, or <a href="#/categories">browse categories</a>.</p>`}
    </div>`;
}

function render404(msg) {
  return `
    <div class="not-found">
      <h1>404</h1>
      <p>${msg || 'Page not found'}</p>
      <p style="margin-top:16px"><a href="#/">← Back to Home</a></p>
    </div>`;
}

// ---- ROUTER ----

function route() {
  const hash = (location.hash || '#/').slice(1);
  const app = document.getElementById('app');

  if (hash === '/' || hash === '') {
    app.innerHTML = renderHome();
  } else if (hash === '/categories') {
    app.innerHTML = renderCategories();
  } else if (hash.startsWith('/c/')) {
    app.innerHTML = renderCategoryPage(decodeURIComponent(hash.slice(3)));
  } else if (hash.startsWith('/p/')) {
    const slug = hash.slice(3).split('?')[0];
    app.innerHTML = renderProductDetail(slug);
    document.title = (bySlug[slug]?.name || 'Product') + ' — Trein';
  } else if (hash.startsWith('/search/')) {
    app.innerHTML = renderSearch(decodeURIComponent(hash.slice(8)));
  } else {
    app.innerHTML = render404();
  }

  window.scrollTo(0, 0);
}

function navigate(path) {
  location.hash = path;
}

// ---- SEARCH ----
document.getElementById('searchBox').addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && this.value.trim()) {
    navigate('/search/' + encodeURIComponent(this.value.trim()));
  }
});

// ---- INIT ----
async function init() {
  try {
    const res = await fetch('products.json');
    products = await res.json();
    bySlug = {};
    byCategory = {};
    for (const p of products) {
      bySlug[p.slug] = p;
      (byCategory[p.category] = byCategory[p.category] || []).push(p);
    }
    window.addEventListener('hashchange', route);
    route();
  } catch (err) {
    document.getElementById('app').innerHTML = `
      <div class="not-found">
        <h1>Error</h1>
        <p>Could not load product catalog: ${err.message}</p>
        <p style="margin-top:8px;font-size:.85rem;color:var(--text-muted)">
          Make sure <code>products.json</code> is in the same directory as this page.</p>
      </div>`;
  }
}

// Handle direct /p/slug URLs (non-hash) by redirecting to hash routes
(function() {
  const path = location.pathname;
  if (path.startsWith('/p/') || path.startsWith('/c/')) {
    location.replace(location.origin + '/#' + path);
  }
})();

init();
</script>
</body>
</html>
